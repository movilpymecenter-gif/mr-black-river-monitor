name: Monitor Mr Black

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-mr-black
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar estaciones SHN y predicciones
        run: python monitor.py

      - name: Publicar mediciones, historiales y predicciones
        run: |
          git config user.name "Mr Black Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ultimo_estado.json

          for archivo in \
            historial_san_fernando.json \
            historial_pilote_norden.json \
            historial_martin_garcia.json \
            pronostico_san_fernando.json
          do
            if [ -f "$archivo" ]; then
              git add "$archivo"
            else
              git add -u -- "$archivo"
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar mediciones e historiales SHN Mr Black"
            git push
          fi
