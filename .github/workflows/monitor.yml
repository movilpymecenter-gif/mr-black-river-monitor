name: Monitor Mr Black

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-mr-black
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar estaciones SHN y predicciones
        run: python monitor.py

      - name: Publicar mediciones, historiales y predicciones
        shell: bash
        run: |
          set -e

          git config user.name "Mr Black Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Guardar los JSON generados por monitor.py
          mkdir -p /tmp/mr-black-datos

          archivos=(
            ultimo_estado.json
            historial_san_fernando.json
            historial_pilote_norden.json
            historial_martin_garcia.json
            pronostico_san_fernando.json
          )

          for archivo in "${archivos[@]}"; do
            if [ -f "$archivo" ]; then
              cp "$archivo" "/tmp/mr-black-datos/$archivo"
            fi
          done

          # Obtener la última versión del repositorio
          git fetch origin main
          git reset --hard origin/main

          # Restaurar los JSON recién generados
          for archivo in "${archivos[@]}"; do
            if [ -f "/tmp/mr-black-datos/$archivo" ]; then
              cp "/tmp/mr-black-datos/$archivo" "$archivo"
              git add "$archivo"
            fi
          done

          # Publicar solamente si existen cambios
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
          else
            git commit -m "Actualizar mediciones e historiales SHN Mr Black"
            git push origin HEAD:main
          fi
